<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Rincón de Pelis ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>NUESTRO RINCÓN DE PELIS ❤️</h1>
  </header>

  <main class="main-container">
    <!-- Reproductor Principal -->
    <section class="player-card">
      <video id="mainPlayer" controls preload="metadata">
        <source id="videoSource" src="" type="video/mp4">
        Tu navegador no soporta streaming HTML5.
      </video>
      <div class="info-bar">
        <h2 id="currentTitle">Cargando...</h2>
        <p id="currentDesc">Selecciona una película para reproducir.</p>
      </div>
    </section>

    <!-- Catálogo de Películas -->
    <section class="catalog-section">
      <h3 class="catalog-title">Películas disponibles</h3>
      <div class="movies-grid" id="moviesList"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
